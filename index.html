<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11163e">
<title>DOZATOR REKLAMACIJA · LOT BE2600645</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    cursor: none;
  }
  #player {
    position: fixed;
    inset: 0;
    background: #000;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(1.005);
    transition: opacity .65s ease, transform 1.2s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  .slide img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  #progress {
    position: fixed;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: rgba(255,255,255,.75);
    z-index: 10;
    opacity: .45;
  }
  #hint {
    position: fixed;
    right: 22px;
    top: 18px;
    z-index: 20;
    color: white;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }
  body.show-ui { cursor: default; }
  body.show-ui #hint { opacity: 1; }
  @media (max-width: 700px) {
    #hint { font-size: 12px; right: 10px; top: 10px; }
  }
</style>
</head>
<body>
<div id="player">
    <div class="slide active"><img src="slide-1.jpg" alt="Slide 1"></div>
    <div class="slide"><img src="slide-2.jpg" alt="Slide 2"></div>
    <div class="slide"><img src="slide-3.jpg" alt="Slide 3"></div>
    <div class="slide"><img src="slide-4.jpg" alt="Slide 4"></div>
    <div class="slide"><img src="slide-5.jpg" alt="Slide 5"></div>
    <div class="slide"><img src="slide-6.jpg" alt="Slide 6"></div>
    <div class="slide"><img src="slide-7.jpg" alt="Slide 7"></div>
    <div class="slide"><img src="slide-8.jpg" alt="Slide 8"></div>
    <div class="slide"><img src="slide-9.jpg" alt="Slide 9"></div>
</div>
<div id="progress"></div>
<div id="hint">← → promjena · Space pauza · F fullscreen</div>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const progress = document.getElementById('progress');
  const intervalMs = 8000;
  let current = 0;
  let paused = false;
  let timer = null;
  let progressStart = performance.now();
  let remaining = intervalMs;
  let uiTimer;

  function show(index) {
    slides[current].classList.remove('active');
    current = (index + slides.length) % slides.length;
    slides[current].classList.add('active');
    restartTimer();
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  function restartTimer() {
    clearTimeout(timer);
    remaining = intervalMs;
    progressStart = performance.now();
    if (!paused) timer = setTimeout(next, intervalMs);
  }

  function togglePause() {
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      remaining = Math.max(0, remaining - (performance.now() - progressStart));
    } else {
      progressStart = performance.now();
      timer = setTimeout(next, remaining || intervalMs);
    }
  }

  async function fullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {}
  }

  function animateProgress(now) {
    if (!paused) {
      const elapsed = now - progressStart;
      const duration = remaining || intervalMs;
      const pct = Math.min(100, Math.max(0, elapsed / duration * 100));
      progress.style.width = pct + '%';
    }
    requestAnimationFrame(animateProgress);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') next();
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      togglePause();
    }
    if (e.key.toLowerCase() === 'f') fullscreen();
  });

  document.addEventListener('click', e => {
    const x = e.clientX / innerWidth;
    if (x < .25) prev();
    else if (x > .75) next();
    else fullscreen();
  });

  document.addEventListener('mousemove', () => {
    document.body.classList.add('show-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => document.body.classList.remove('show-ui'), 1800);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else restartTimer();
  });

  restartTimer();
  requestAnimationFrame(animateProgress);
})();
</script>
</body>
</html>
